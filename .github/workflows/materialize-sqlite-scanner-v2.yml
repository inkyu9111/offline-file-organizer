name: Materialize SQLite scanner update v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-sqlite-scanner-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-sqlite-scanner-v2
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load staged documents
        run: |
          set -euo pipefail
          git fetch origin refs/heads/sqlite-streaming-staging-v2:refs/remotes/origin/sqlite-streaming-staging-v2
          git show origin/sqlite-streaming-staging-v2:staging/README.md > README.md
          git show origin/sqlite-streaming-staging-v2:staging/run_scanner.bat > run_scanner.bat
          git show origin/sqlite-streaming-staging-v2:staging/test_readonly_file_scanner.py > test_readonly_file_scanner.py
          python - <<'PY'
          from pathlib import Path

          path = Path("test_readonly_file_scanner.py")
          content = path.read_text(encoding="utf-8")
          old = 'payload = b"같은 파일 내용"'
          new = 'payload = "같은 파일 내용".encode("utf-8")'
          if old not in content:
              raise SystemExit("고칠 시험 문자열을 찾지 못했습니다.")
          path.write_text(content.replace(old, new), encoding="utf-8", newline="\n")
          PY

      - name: Load verified scanner source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          candidates: list[tuple[str, str]] = []
          current = Path("readonly_file_scanner.py")
          if current.is_file():
              candidates.append(("current", current.read_text(encoding="utf-8")))

          for sha in (
              "c19114111ce82ee4c10ade2558130331067eda05",
              "547cb57882b085829e1c98c5aef388d5aec1cb35",
          ):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/inkyu9111/offline-file-organizer/git/blobs/{sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "User-Agent": "offline-file-organizer-materializer",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              text = base64.b64decode(payload["content"]).decode("utf-8")
              candidates.append((sha, text))

          required = (
              "import sqlite3",
              "scan_run",
              "progress_interval",
              "commit_every",
              "temp_store",
          )
          matching = [
              (name, text)
              for name, text in candidates
              if all(token in text for token in required)
          ]
          if not matching:
              raise SystemExit("SQLite 스트리밍 스캐너 소스를 찾지 못했습니다.")

          name, source = max(matching, key=lambda item: len(item[1]))
          if "import csv" in source or "file_manifest.csv" in source:
              raise SystemExit("이전 CSV 출력 코드가 남아 있습니다.")
          Path("readonly_file_scanner.py").write_text(source, encoding="utf-8", newline="\n")
          print(f"선택한 소스: {name}, {len(source):,}자")
          PY

      - name: Verify source and tests
        run: |
          set -euo pipefail
          python -m py_compile readonly_file_scanner.py test_readonly_file_scanner.py
          python -m unittest -v test_readonly_file_scanner.py

      - name: Run multi-root smoke test
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          mkdir -p "$temporary/root-a/보고서" "$temporary/root-b/자료" "$temporary/output"
          printf 'alpha' > "$temporary/root-a/보고서/a.txt"
          printf 'same' > "$temporary/root-a/보고서/dup-a.bin"
          printf 'beta' > "$temporary/root-b/자료/b.txt"
          printf 'same' > "$temporary/root-b/자료/dup-b.bin"
          python readonly_file_scanner.py \
            "$temporary/root-a" \
            "$temporary/root-b" \
            --output "$temporary/output/scan.sqlite3" \
            --hash-duplicates \
            --progress-interval 0 \
            --progress-every 1 \
            --commit-every 1
          python - "$temporary/output/scan.sqlite3" <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect(sys.argv[1])
          try:
              assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert connection.execute("SELECT COUNT(*) FROM scan_roots").fetchone()[0] == 2
              assert connection.execute("SELECT COUNT(*) FROM files").fetchone()[0] == 4
              assert connection.execute("SELECT COUNT(DISTINCT root_id) FROM files").fetchone()[0] == 2
              assert connection.execute("SELECT COUNT(*) FROM v_confirmed_duplicates").fetchone()[0] == 2
              status = connection.execute(
                  "SELECT status FROM scan_run WHERE run_id = 1"
              ).fetchone()[0]
              assert status in {"completed", "completed_with_errors"}
          finally:
              connection.close()
          PY

      - name: Commit verified files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/materialize-sqlite-scanner.yml
          rm -f .github/workflows/materialize-sqlite-scanner-v2.yml
          rm -rf __pycache__
          git add README.md readonly_file_scanner.py run_scanner.bat test_readonly_file_scanner.py .github/workflows/materialize-sqlite-scanner.yml .github/workflows/materialize-sqlite-scanner-v2.yml
          git diff --cached --check
          git commit -m "feat: stream multi-root scans to SQLite"
          git push origin HEAD:main
          git push origin --delete sqlite-streaming-staging-v2 || true
          git push origin --delete sqlite-streaming-staging-v3 || true
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
